name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e .

      # No network, no API keys: the suite is deterministic on purpose.
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install rich
      - name: Every command answers
        run: |
          ./bastet doctor
          ./bastet cat
          ./bastet ioc 8.8.8.8 evil-login.top
          ./bastet logs examples/auth.log --fail-on critical || [ $? -eq 4 ]
          ./bastet attack T1110
          ./bastet port 445
          ./bastet ip 10.0.0.0/24
          ./bastet triage --list
